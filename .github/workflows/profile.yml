name: Update profile cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-profile.py
      - assets/icons/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate images from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-profile.py
      - name: Commit refreshed cards
        run: |
          if ! git diff --quiet -- assets; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/overview.svg assets/overview-mobile.svg assets/contributions.svg assets/contributions-mobile.svg assets/languages.svg assets/languages-mobile.svg
            git commit -m "chore: refresh profile cards"
            git push
          fi
