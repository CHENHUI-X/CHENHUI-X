  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="147" rx="10"/>
  <text class="text" x="24" y="32" font-size="17" font-weight="600">Chenhui’s GitHub Stats</text><text class="accent" x="24" y="78" font-size="30" font-weight="600">926</text><text class="muted" x="24" y="103" font-size="12">Stars on public repos</text><text class="accent" x="232" y="78" font-size="30" font-weight="600">79</text><text class="muted" x="232" y="103" font-size="12">Commits · last 12 months</text><text class="accent" x="440" y="78" font-size="30" font-weight="600">1</text><text class="muted" x="440" y="103" font-size="12">Pull requests · last 12 months</text><text class="accent" x="648" y="78" font-size="30" font-weight="600">2</text><text class="muted" x="648" y="103" font-size="12">Issues · last 12 months</text><text class="muted" x="24" y="128" font-size="11">Updated 2026-11-06 · GitHub data</text>
