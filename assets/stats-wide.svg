<svg xmlns="http://www.w3.org/2000/svg" width="860" height="148" viewBox="0 0 860 148" role="img" aria-labelledby="title">
  <title id="title">Chenhui&#x27;s GitHub statistics</title>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .bg{fill:#ffffff;stroke:#d0d7de} .text{fill:#1f2328}
    .muted{fill:#656d76} .accent{fill:#0969da}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .level-0{fill:#eff2f5}.level-1{fill:#d5e9ff}.level-2{fill:#9acbff}.level-3{fill:#58a6ff}.level-4{fill:#0969da}
